name: Request correction or takedown
description: Report an attribution, prompt, source-link, or mirrored-media problem.
title: "[Takedown or correction] "
body:
  - type: markdown
    attributes:
      value: |
        Please do not post private identity documents, addresses, or other sensitive information. Maintainers may ask for minimal verification privately when needed.
  - type: input
    id: affected_url
    attributes:
      label: Affected repository or source URL
      placeholder: Link to the item, source post, or media object.
    validations:
      required: true
  - type: dropdown
    id: request_type
    attributes:
      label: Request
      options:
        - Correct attribution
        - Correct prompt or annotation
        - Remove mirrored media
        - Remove repository entry
        - Mark the source unavailable
    validations:
      required: true
  - type: textarea
    id: relationship
    attributes:
      label: Your relationship to the material
      description: For example, original creator, prompt author, poster, rights holder, or reporter.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Requested change and supporting links
      description: Explain the correction or removal and cite public evidence where possible.
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Optional contact route
      description: Do not enter private information you do not want published in the issue.
